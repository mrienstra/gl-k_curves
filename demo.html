<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GL-k curves demo</title>
<style>
  body { margin: 0; background: #1a1a1a; color: #ddd; font: 14px/1.5 monospace; display: flex; }
  #sidebar { width: 200px; padding: 16px; flex-shrink: 0; }
  canvas { cursor: crosshair; display: block; }
  label { display: block; margin: 6px 0 2px; }
  .legend { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 12px; }
  .swatch { width: 24px; height: 3px; display: inline-block; }
  button { margin-top: 10px; padding: 4px 10px; background: #333; color: #ddd;
           border: 1px solid #555; cursor: pointer; width: 100%; }
  button:hover { background: #444; }
  p { font-size: 11px; color: #888; margin: 12px 0 0; }
  #segInfo { color: #aaa; font-size: 12px; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="sidebar">
  <b>GL-k curves</b>
  <p>Click canvas to add points.<br>Drag to move.<br>Dbl-click to remove.</p>

  <label><input type="checkbox" id="chk0" checked> GL-0</label>
  <label><input type="checkbox" id="chk1" checked> GL-1</label>
  <label><input type="checkbox" id="chk2" checked> GL-2</label>
  <label><input type="checkbox" id="chkM0"> mod GL-0</label>
  <label><input type="checkbox" id="chkM1" checked> mod GL-1</label>
  <label><input type="checkbox" id="chkPoly" checked> polygon</label>

  <div class="legend"><span class="swatch" style="background:#f97"></span> GL-0</div>
  <div class="legend"><span class="swatch" style="background:#7bf"></span> GL-1</div>
  <div class="legend"><span class="swatch" style="background:#8f8"></span> GL-2</div>
  <div class="legend"><span class="swatch" style="background:#f5c;height:2px"></span> mod GL-0</div>
  <div class="legend"><span class="swatch" style="background:#fc6;height:2px"></span> mod GL-1</div>
  <div class="legend"><span class="swatch" style="background:#555;height:1px"></span> polygon</div>

  <label style="margin-top:10px">η <span id="etaVal">auto</span>
    <input type="range" id="sldEta" min="0" max="40" step="0.5" value="0"
           style="width:100%;margin:2px 0">
  </label>
  <p style="margin-top:2px;font-size:10px;color:#666">0 = paper default (1/ω₀)</p>

  <div id="segInfo">Seg 1 / 1</div>

  <button id="btnNewSeg">New segment</button>
  <button id="btnClear">Clear segment</button>
  <button id="btnReset">Reset to example</button>
  <button id="btnCopy">Copy JSON</button>
  <button id="btnPaste">Paste JSON</button>

  <p><a href="basis.html" style="color:#7bf">basis functions →</a></p>
</div>
<canvas id="c"></canvas>

<script type="module">
import { sampleGLK }         from './glk-curve.mjs';
import { sampleModifiedGLK } from './glk-modified.mjs';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── state ──────────────────────────────────────────────────────────────────
let segments = [
  [[120, 350], [200, 100], [320, 280], [440, 80], [560, 300], [660, 140]],
];
let activeSeg = 0;
let drag = null;   // { s: segIndex, i: ptIndex } or null

// ── sizing ─────────────────────────────────────────────────────────────────
function resize() {
  canvas.width  = window.innerWidth - 200;
  canvas.height = window.innerHeight;
  draw();
}
window.addEventListener('resize', resize);

// ── drawing ────────────────────────────────────────────────────────────────
function drawCurve(samples, color, width = 2) {
  if (samples.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(samples[0][0], samples[0][1]);
  for (let i = 1; i < samples.length; i++) ctx.lineTo(samples[i][0], samples[i][1]);
  ctx.strokeStyle = color;
  ctx.lineWidth   = width;
  ctx.stroke();
}

function drawPolygon(pts) {
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = '#555';
  ctx.lineWidth   = 1;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPoints(pts, isActive) {
  for (let i = 0; i < pts.length; i++) {
    ctx.beginPath();
    ctx.arc(pts[i][0], pts[i][1], isActive ? 6 : 4, 0, Math.PI * 2);
    ctx.fillStyle = isActive
      ? (i === 0 || i === pts.length - 1 ? '#fa6' : '#aaa')
      : '#666';
    ctx.fill();
    if (isActive) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const anyPoints = segments.some(s => s.length > 0);
  if (!anyPoints) {
    ctx.fillStyle = '#555';
    ctx.fillText('Click to add control points', 20, 40);
  }

  const N   = 300;
  const raw = parseFloat(document.getElementById('sldEta').value);
  const eta = raw === 0 ? null : raw;   // 0 → paper default (null = 1/ω₀)
  document.getElementById('etaVal').textContent = eta === null ? 'auto' : raw.toFixed(1);

  for (let s = 0; s < segments.length; s++) {
    const pts = segments[s];
    if (pts.length < 2) continue;

    if (document.getElementById('chkPoly').checked) drawPolygon(pts);

    try {
      if (document.getElementById('chk0').checked)
        drawCurve(sampleGLK(pts, 0, N), '#f97');
      if (document.getElementById('chk1').checked && pts.length >= 2)
        drawCurve(sampleGLK(pts, 1, N), '#7bf');
      if (document.getElementById('chk2').checked && pts.length >= 3)
        drawCurve(sampleGLK(pts, 2, N), '#8f8');
      if (document.getElementById('chkM0').checked && pts.length >= 4)
        drawCurve(sampleModifiedGLK(pts, 0, N, eta, eta), '#f5c', 2);
      if (document.getElementById('chkM1').checked && pts.length >= 4)
        drawCurve(sampleModifiedGLK(pts, 1, N, eta, eta), '#fc6', 2.5);
    } catch (e) {
      ctx.fillStyle = '#f66';
      ctx.fillText(e.message, 10, 20);
    }
  }

  for (let s = 0; s < segments.length; s++) {
    drawPoints(segments[s], s === activeSeg);
  }

  document.getElementById('segInfo').textContent =
    `Seg ${activeSeg + 1} / ${segments.length}`;
}

// ── interaction ────────────────────────────────────────────────────────────
function nearestPoint(x, y, radius = 12) {
  let best = null, bestD = Infinity;
  for (let s = 0; s < segments.length; s++) {
    for (let i = 0; i < segments[s].length; i++) {
      const d = Math.hypot(segments[s][i][0] - x, segments[s][i][1] - y);
      if (d < radius && d < bestD) { best = { s, i }; bestD = d; }
    }
  }
  return best;
}

canvas.addEventListener('mousedown', e => {
  const x = e.offsetX, y = e.offsetY;
  const hit = nearestPoint(x, y);
  if (hit) { drag = hit; activeSeg = hit.s; draw(); return; }
  segments[activeSeg].push([x, y]);
  draw();
});

canvas.addEventListener('mousemove', e => {
  if (!drag) return;
  segments[drag.s][drag.i] = [e.offsetX, e.offsetY];
  draw();
});

canvas.addEventListener('mouseup', () => { drag = null; });

canvas.addEventListener('dblclick', e => {
  const hit = nearestPoint(e.offsetX, e.offsetY);
  if (!hit) return;
  segments[hit.s].splice(hit.i, 1);
  // Prune empty segments, but always keep at least one
  if (segments[hit.s].length === 0 && segments.length > 1) {
    segments.splice(hit.s, 1);
    activeSeg = Math.min(activeSeg, segments.length - 1);
  }
  draw();
});

document.getElementById('btnNewSeg').addEventListener('click', () => {
  segments.push([]);
  activeSeg = segments.length - 1;
  draw();
});

document.getElementById('btnClear').addEventListener('click', () => {
  if (segments.length > 1) {
    segments.splice(activeSeg, 1);
    activeSeg = Math.min(activeSeg, segments.length - 1);
  } else {
    segments[0] = [];
  }
  draw();
});

document.getElementById('btnReset').addEventListener('click', () => {
  segments = [
    [[120, 350], [200, 100], [320, 280], [440, 80], [560, 300], [660, 140]],
  ];
  activeSeg = 0;
  draw();
});

document.getElementById('btnCopy').addEventListener('click', () => {
  const rounded = segments.map(seg => seg.map(([x, y]) => [Math.round(x), Math.round(y)]));
  const raw = parseFloat(document.getElementById('sldEta').value);
  // Include eta only when non-default; use plain array format when no eta
  const payload = raw === 0
    ? rounded
    : { segments: rounded, eta: raw };
  const json = JSON.stringify(payload);
  navigator.clipboard.writeText(json).catch(() => prompt('Copy this JSON:', json));
});

document.getElementById('btnPaste').addEventListener('click', async () => {
  let text;
  try {
    text = await navigator.clipboard.readText();
  } catch {
    text = prompt('Paste JSON here:');
  }
  if (!text) return;
  try {
    const data = JSON.parse(text);
    // Object format: { segments: [...], eta?: number }
    // Array format (legacy): [[x,y],...] or [[[x,y],...],...]
    let segs, etaOverride = null;
    if (Array.isArray(data)) {
      segs = Array.isArray(data[0][0]) ? data : [data];
    } else {
      segs = data.segments;
      if (typeof data.eta === 'number') etaOverride = data.eta;
    }
    segments  = segs;
    activeSeg = 0;
    if (etaOverride !== null) {
      document.getElementById('sldEta').value = etaOverride;
    }
    draw();
  } catch {
    alert('Invalid JSON — expected [[x,y],...], [[[x,y],...],...], or {"segments":[...],"eta":n}');
  }
});

document.getElementById('sldEta').addEventListener('input', draw);
document.querySelectorAll('input[type=checkbox]').forEach(el =>
  el.addEventListener('change', draw));

resize();
</script>
</body>
</html>
